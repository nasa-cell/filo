<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filo</title>
<link rel="stylesheet" href="estilos/estilos.css?v=6">
<link rel="stylesheet" href="estilos/fondos.css?v=24">
<link rel="stylesheet" href="estilos/tres.css?v=2">
<script type="importmap">{ "imports": {
  "three": "./tres/librerias/three/three.module.min.js",
  "three/addons/": "./tres/librerias/three/addons/",
  "@pixiv/three-vrm": "./tres/librerias/three-vrm/three-vrm.module.min.js"
} }</script>
</head>
<body data-estilo="A">
<div class="fondo" id="fondo" aria-hidden="true"></div>
<header class="arriba">
  <h1>Filo</h1>
  <div class="estilos" role="group" aria-label="Cómo ver a Filo">
    <span class="rotulo">Ver:</span>
    <button class="vista" data-vista="ilustracion" aria-pressed="true">Ilustración</button>
    <button class="vista" data-vista="tres" aria-pressed="false">3D</button>
    <button class="vista" data-vista="ambas" aria-pressed="false">Las dos</button>
  </div>
  <button class="vista b-youtube" id="b-youtube" type="button" aria-pressed="false" title="Modo YouTube: todo lo que pidas, Filo lo busca en YouTube">▶ <span class="largo">Modo </span>YouTube</button>
  <button class="vista b-busqueda" id="b-busqueda" type="button" aria-pressed="false" title="Modo búsqueda: todo lo que preguntes, Filo lo busca en internet">🔍 <span class="largo">Modo búsqueda</span><span class="corto">Buscar</span></button>
</header>

<main class="escenario">
  <div id="ilustracion"></div>
  <div id="filo" hidden></div>
  <div class="estado" id="estado" role="status" aria-live="polite" hidden></div>
  <div class="aviso-ropa" id="aviso-ropa" role="status" aria-live="polite" hidden><span></span><div class="aviso-ropa-barra"><i></i></div><small></small></div>
  <div class="burbuja-video" id="burbuja-video" aria-live="polite" hidden></div>
  <div class="nube-pensar" id="nube-pensar" aria-live="polite" hidden></div>
  <video class="camara" id="camara" autoplay muted playsinline hidden></video>
  <div class="lado" id="lado" hidden></div>
  <button type="button" class="album" id="album" hidden title="Álbum de Filo: tus dibujos guardados" aria-label="Abrir el álbum de dibujos"><span class="album-hoja"><img id="album-tapa" alt=""></span><span class="album-n" id="album-n">0</span></button>
</main>
<div class="grande" id="grande" hidden></div>

<form class="charla" id="charla" autocomplete="off">
  <button class="boton suave" id="b-hablar" type="button" title="Saludar a Filo" aria-label="Saludar">💬<span class="texto-saludar"> Saludar</span></button>
  <textarea id="mensaje" rows="1" maxlength="600" placeholder="Escríbele algo a Filo…" aria-label="Mensaje para Filo" enterkeyhint="send"></textarea>
  <div class="adjunto" id="adjunto" hidden><img id="adjunto-img" alt="Foto para Filo"><span>Filo verá esta foto</span><button type="button" id="adjunto-quitar">✕ Quitar</button></div>
  <input id="archivo" type="file" accept="image/*" hidden>
  <button class="boton redondo" id="b-adjuntar" type="button" aria-label="Mostrarle una foto" title="Mostrarle una foto (también puedes arrastrarla o pegarla)">📎</button>
  <button class="boton redondo" id="b-camara" type="button" aria-pressed="false" aria-label="Encender la cámara para que Filo vea" title="Encender la cámara para que Filo vea">📷</button>
  <button class="boton redondo" id="b-micro" type="button" aria-pressed="false" aria-label="Hablarle con el micrófono" title="Hablarle con el micrófono">🎤</button>
  <button class="boton" id="b-enviar" type="submit">Enviar</button>
</form>
<script src="codigo/fondo.js?v=5"></script>
<script src="codigo/ropa.js?v=5"></script>
<script src="codigo/ilustracion.js?v=5"></script>
<script src="codigo/tres.js?v=7"></script>
<script src="codigo/acciones.js?v=6"></script>
<script src="codigo/acceso.js?v=5"></script>
  <script src="codigo/frases-filo.js?v=5"></script>
<script src="codigo/conversacion.js?v=12"></script>
<script src="codigo/separar.js?v=16"></script>
<script src="codigo/distribucion.js?v=1"></script>
</body>
</html>
